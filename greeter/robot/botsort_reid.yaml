# BoT-SORT with ReID (Ultralytics). The webcam is fixed to the robot's chest, so
# global motion compensation is off; lost tracks are kept ~6 s at 15 fps so a
# visitor hidden briefly by someone walking past keeps their ID.
tracker_type: botsort
track_high_thresh: 0.25
track_low_thresh: 0.1
new_track_thresh: 0.25
track_buffer: 90
match_thresh: 0.8
fuse_score: True
gmc_method: none
proximity_thresh: 0.5
appearance_thresh: 0.8
with_reid: True
model: auto

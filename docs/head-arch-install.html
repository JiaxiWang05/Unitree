<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>头盔安装动画</title>
<style>
:root{--bg:#f6f7f9;--ink:#15171c;--muted:#5b6170;--robot:#c9ccd3;--robot2:#a9adb6;--part:#7a52d6;--steel:#8a8f99;--accent:#7a52d6}
@media (prefers-color-scheme:dark){:root{--bg:#15171c;--ink:#eef0f4;--muted:#a3a8b5;--robot:#4a4f5a;--robot2:#5c626e;--part:#9d7cf0;--steel:#b7bcc6}}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif;display:flex;justify-content:center}
.wrap{max-width:640px;width:100%;padding:16px;box-sizing:border-box}
h1{font-size:20px;margin:0 0 8px}
svg{width:100%;height:auto;display:block}
.cap{min-height:4.5em;font-size:17px;margin:10px 0}
.cap b{color:var(--accent)}
.bar{display:flex;gap:8px;align-items:center}
button{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid var(--muted);background:transparent;color:var(--ink);cursor:pointer}
.dots{display:flex;gap:6px;margin-left:auto}.dots i{width:9px;height:9px;border-radius:50%;background:var(--muted);opacity:.35}.dots i.on{opacity:1;background:var(--accent)}
.mv{transition:transform 1.1s ease,opacity .8s ease}
.note{color:var(--muted);font-size:14px;margin-top:10px}
</style></head><body><div class="wrap">
<h1>头盔怎么装（从机器人背后看）</h1>
<svg viewBox="0 0 400 340" aria-label="安装动画">
  <!-- robot -->
  <rect x="40" y="250" width="320" height="100" rx="30" fill="var(--robot)"/>
  <rect x="178" y="205" width="44" height="50" fill="var(--robot2)"/>
  <ellipse cx="200" cy="150" rx="62" ry="72" fill="var(--robot)"/>
  <ellipse cx="200" cy="105" rx="64" ry="34" fill="var(--robot2)"/>
  <!-- rings -->
  <g id="rings"><path d="M118 252 v-12 a10 10 0 0 1 20 0 v12 z M262 252 v-12 a10 10 0 0 1 20 0 v12 z" fill="none" stroke="var(--steel)" stroke-width="5"/></g>
  <circle id="hl1" cx="128" cy="240" r="20" fill="none" stroke="#e0a030" stroke-width="3" class="mv" opacity="0"/>
  <circle id="hl2" cx="272" cy="240" r="20" fill="none" stroke="#e0a030" stroke-width="3" class="mv" opacity="0"/>
  <!-- feet -->
  <g id="feet" class="mv" opacity="0" style="transform:translateY(-120px)">
    <path d="M110 254 v-22 a18 18 0 0 1 36 0 v22 z" fill="var(--part)"/><rect x="122" y="196" width="12" height="22" rx="3" fill="var(--part)"/>
    <path d="M254 254 v-22 a18 18 0 0 1 36 0 v22 z" fill="var(--part)"/><rect x="266" y="196" width="12" height="22" rx="3" fill="var(--part)"/>
    <text x="128" y="247" font-size="12" text-anchor="middle" fill="#fff">L</text><text x="272" y="247" font-size="12" text-anchor="middle" fill="#fff">R</text>
  </g>
  <!-- thumb screws -->
  <g id="screws" class="mv" opacity="0" style="transform:translateX(0)">
    <g id="sL" class="mv" style="transform:translateX(-40px)"><rect x="92" y="236" width="18" height="8" fill="var(--steel)"/><rect x="84" y="230" width="8" height="20" rx="2" fill="var(--steel)"/></g>
    <g id="sR" class="mv" style="transform:translateX(40px)"><rect x="290" y="236" width="18" height="8" fill="var(--steel)"/><rect x="308" y="230" width="8" height="20" rx="2" fill="var(--steel)"/></g>
  </g>
  <!-- crown + camera -->
  <g id="crown" class="mv" opacity="0" style="transform:translateY(-140px)">
    <path d="M122 218 V140 C122 80 160 66 200 66 C240 66 278 80 278 140 V218 h12 V140 C290 70 245 54 200 54 C155 54 110 70 110 140 V218 z" fill="var(--part)"/>
    <rect x="182" y="66" width="36" height="12" rx="3" fill="var(--part)"/>
    <rect x="186" y="77" width="28" height="4" fill="#e0a030"/>
    <g id="cam"><rect x="150" y="28" width="100" height="26" rx="5" fill="#222"/><circle cx="200" cy="41" r="6" fill="#555"/></g>
  </g>
  <!-- M3 screws at the leg joints -->
  <g id="m3" class="mv" opacity="0"><circle cx="128" cy="204" r="3" fill="var(--steel)"/><circle cx="128" cy="214" r="3" fill="var(--steel)"/><circle cx="272" cy="204" r="3" fill="var(--steel)"/><circle cx="272" cy="214" r="3" fill="var(--steel)"/></g>
  <!-- cable -->
  <path id="cable" d="M200 54 C170 58 128 70 120 120 V215 C118 240 150 250 200 260" fill="none" stroke="#111" stroke-width="3.5" stroke-dasharray="420" stroke-dashoffset="420" style="transition:stroke-dashoffset 1.6s ease"/>
  <text id="ok" x="200" y="330" font-size="15" text-anchor="middle" fill="var(--accent)" class="mv" opacity="0">✓ 装好了：只靠泡棉压在头顶，左右两颗螺丝防掉</text>
</svg>
<div class="cap" id="cap"></div>
<div class="bar"><button id="prev">上一步</button><button id="play">暂停</button><button id="next">下一步</button><div class="dots" id="dots"></div></div>
<p class="note">机器人坐着或躺着、关机，<b>不要挂在吊环上</b>。拆下：拧掉两颗手拧螺丝，整个架子往上提。</p>
</div>
<script>
const S=[
 ['<b>第 1 步</b>：找到肩膀上、脖子两边的两个<b>钢吊环</b>（黄圈）。'],
 ['<b>第 2 步</b>：把印着 <b>L</b> 的脚套到机器人左肩的吊环上，<b>R</b> 套右肩。从上往下直着套，孔对上吊环的孔。'],
 ['<b>第 3 步</b>：脖子那侧的六角槽里放 M5 尼龙螺母；从<b>肩膀外侧</b>用手拧进 M5 手拧螺丝，拧紧就行，别用力。'],
 ['<b>第 4 步</b>：Brio 去掉夹子放到头盔顶上，从下面用 ¼" 螺丝拧 3 圈固定；头顶块下面贴好<b>黄色泡棉</b>。'],
 ['<b>第 5 步</b>：把头盔从上往下罩过头，两条腿落在两只脚的后面，泡棉压在头顶上。'],
 ['<b>第 6 步</b>：每边接口从后面插 2 颗 M3×12 螺丝进螺母，用 2.5 mm 六角扳手轻轻拧紧。'],
 ['<b>第 7 步</b>：插上 USB-C 线，压进<b>左腿背后的槽</b>里，用 3 根扎带扎住，接到脖子后面的 USB-C 口。'],
 ['<b>完成</b>：晃一晃，不松动、只有泡棉碰到头就对了。']];
const $=id=>document.getElementById(id);let k=0,timer=null,playing=true;
const dots=$('dots');S.forEach(()=>dots.appendChild(document.createElement('i')));
function set(el,o,t){el=$(el);el.style.opacity=o;if(t!==undefined)el.style.transform=t;}
function show(i){k=(i+S.length)%S.length;$('cap').innerHTML=S[k][0];[...dots.children].forEach((d,j)=>d.className=j===k?'on':'');
 set('hl1',k===0?1:0);set('hl2',k===0?1:0);
 set('feet',k>=1?1:0,k>=1?'translateY(0)':'translateY(-120px)');
 set('screws',k>=2?1:0);set('sL',1,k>=2?'translateX(0)':'translateX(-40px)');set('sR',1,k>=2?'translateX(0)':'translateX(40px)');
 set('crown',k>=3?1:0,k>=4?'translateY(0)':'translateY(-140px)');
 set('m3',k>=5?1:0);$('cable').style.strokeDashoffset=k>=6?0:420;set('ok',k>=7?1:0);}
function auto(){clearInterval(timer);if(playing)timer=setInterval(()=>show(k+1),3200);}
$('next').onclick=()=>{show(k+1);auto()};$('prev').onclick=()=>{show(k-1);auto()};
$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'暂停':'播放';auto()};
show(0);auto();
</script></body></html>
